# Local environment: PostgreSQL + the FinGuard app.
#   docker compose up -d --build      -> UI at http://localhost:8000, API docs at /docs
#   docker compose up -d db           -> only the database, to run the app/tests from your venv
# The credentials below are for a throwaway local database only.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finguard
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/finguard
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
